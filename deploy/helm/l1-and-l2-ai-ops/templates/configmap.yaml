apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiops.fullname" . }}-control-plane
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
data:
  AGENT_WEBHOOK_HOST: "0.0.0.0"
  AGENT_WEBHOOK_PORT: {{ .Values.api.port | quote }}
  # Workers are their own pods. The API pods serve, poll and nothing else.
  WORKER_EMBEDDED: "false"
  RUNNER_MODE: {{ .Values.controlPlane.runnerMode | quote }}
  ACTIONS_MAX_TIER: {{ .Values.controlPlane.maxTier | quote }}
  ACTIONS_MAX_AUTONOMY: {{ .Values.controlPlane.maxAutonomy | quote }}
  {{- if include "aiops.remote" . }}
  RUNNER_DISPATCH_KEY_REF: "file:/run/secrets/dispatch/dispatch.key"
  {{- end }}
  {{- range $name, $value := .Values.config }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- if include "aiops.remote" . }}
---
# The runner's own limits. They are read from here by the runner only; the control
# plane has no route by which to change them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiops.fullname" . }}-runner
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
data:
  targets.json: {{ .Values.runner.targets | toJson | quote }}
  connections.json: {{ .Values.runner.connections | toJson | quote }}
{{- end }}
