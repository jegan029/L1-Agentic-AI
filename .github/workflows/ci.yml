name: CI

on:
  push:
    branches: [master, main, "phase-*/**"]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check src/ tests/ evals/

      - name: Check lint rules
        run: ruff check src/ tests/ evals/

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Tenant isolation, queue locking and the audit guard are only real on PostgreSQL.
      # With these set, a test that cannot reach the database fails; it is never skipped.
      L1_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      L1_REQUIRE_POSTGRES: "1"
      L1_REQUIRE_SAML: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run all tests with coverage (SQLite and PostgreSQL)
        run: |
          pytest tests/ -v --timeout=180 --cov=src/l1_agent --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=75 | tee result.txt
          if grep -E "tests/(db|api|contract|evals)/.*SKIPPED" result.txt; then
            echo "A database, sign-in, connector contract or evaluation test was skipped" >&2
            exit 1
          fi

      - name: Run the demo end to end
        run: python -m src.l1_agent.demo

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  # Model use (ADR 0009): golden incidents, the injection corpus and the redaction
  # corpus, against stand-in models that obey injected text, give the worst valid
  # answer, return garbage, or fail. No real provider is called and nothing is spent.
  evals:
    name: Model evaluation suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the evaluation suite
        run: python -m evals.run

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t l1-agent:ci-${{ github.sha }} .

      - name: Build demo image
        run: docker build --target demo -t l1-agent-demo:ci-${{ github.sha }} .

      - name: Production image refuses to start without credentials
        run: |
          if docker run --rm l1-agent:ci-${{ github.sha }}; then
            echo "Service started without a database and AGENT_WEBHOOK_SECRET" >&2
            exit 1
          fi

      - name: Production image refuses demo mode on a public address without credentials
        run: |
          if docker run --rm -e AGENT_DEMO_MODE=true l1-agent:ci-${{ github.sha }}; then
            echo "Demo mode started unauthenticated on 0.0.0.0" >&2
            exit 1
          fi

      - name: Demo image runs
        run: docker run --rm l1-agent-demo:ci-${{ github.sha }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Static analysis (blocking)
        run: |
          pip install "bandit[toml]"
          bandit -r src/ \
            -x src/l1_agent/adapters/mock_adapters.py \
            --severity-level medium \
            --confidence-level medium

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The list of terms that must never appear (customer names and the like) is
      # held in a repository secret so that the list itself is not in the code.
      # One term per line. The step is skipped when the secret is not set.
      - name: Deny-list check
        env:
          DENY_LIST: ${{ secrets.BRANDING_DENYLIST }}
        run: |
          if [ -z "$DENY_LIST" ]; then
            echo "BRANDING_DENYLIST is not configured; skipping."
            exit 0
          fi
          printf '%s\n' "$DENY_LIST" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/deny.txt"
          if git grep -n -i -I -F -f "$RUNNER_TEMP/deny.txt" -- . ; then
            echo "A deny-listed term is present in the tree." >&2
            exit 1
          fi
          if git ls-files | grep -i -F -f "$RUNNER_TEMP/deny.txt"; then
            echo "A deny-listed term is present in a file name." >&2
            exit 1
          fi
