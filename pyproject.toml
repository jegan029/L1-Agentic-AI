[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l1-and-l2-ai-ops"
version = "1.0.0"
description = "L1 and L2 AI-Ops: incident triage and remediation by executing published SOPs"
requires-python = ">=3.11"

dependencies = [
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "pyyaml>=6.0",
]
saml = [
    "python3-saml>=1.16.0",
]
connectors = [
    "selenium>=4.18.0",
    "py3270>=0.3.5",
    "hvac>=2.1.0",
    "boto3>=1.34.0",
    "mcp==1.26.0",
]

[project.scripts]
l1-agent = "src.l1_agent.cli:main"
l1-agent-demo = "src.l1_agent.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live provider tests cost money and need a key: run them on purpose with
#   pytest tests/live -m live_llm -v -s
#   pytest tests/live -m live_servicenow -v -s   (writes to the configured instance)
addopts = "-m 'not live_llm and not live_servicenow'"
# PostgreSQL tests run when L1_TEST_PG_ADMIN_URL is set (see tests/conftest.py).
filterwarnings = ["ignore:Setting per-request cookies:DeprecationWarning"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "live_servicenow: reads and writes the configured ServiceNow instance; skipped unless SERVICENOW_* are set",
    "live_llm: calls the configured model provider; skipped unless LLM_API_KEY, LLM_ENDPOINT and LLM_MODEL are set",
    "splunk_live: seeds and searches a Splunk lab; skipped unless SPLUNK_LIVE_TESTS=1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["src*"]
