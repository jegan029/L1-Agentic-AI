{{- $full := include "aiops.fullname" . -}}
{{- $enrol := and (include "aiops.remote" .) .Values.runner.publicKey -}}
# Before every install and upgrade, in order: apply the schema migrations, make sure the
# tenant exists, and enrol the runner's public key. Each step is safe to repeat.
# This is the only place the migration role's connection string is used.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-install-{{ .Release.Revision }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: install
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "aiops.selector" . | nindent 8 }}
        app.kubernetes.io/component: install
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "aiops.scheduling" . | nindent 6 }}
      initContainers:
        - name: migrate
          image: {{ include "aiops.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env: &install-env
            - name: DATABASE_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: {{ .Values.database.migrationUrlKey }}
            {{- include "aiops.controlPlaneEnv" . | nindent 12 }}
          volumeMounts: &install-mounts
            - name: tmp
              mountPath: /tmp
        {{- if $enrol }}
        - name: tenant
          image: {{ include "aiops.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["tenant", "create", "--slug", {{ .Values.tenant.slug | quote }}, "--name", {{ default .Values.tenant.slug .Values.tenant.name | quote }}]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env: *install-env
          volumeMounts: *install-mounts
        {{- end }}
      containers:
        {{- if $enrol }}
        - name: enrol-runner
          image: {{ include "aiops.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["runner", "enrol", "--name", {{ .Values.runner.name | quote }}, "--public-key", {{ .Values.runner.publicKey | quote }}, "--if-absent"]
        {{- else }}
        - name: tenant
          image: {{ include "aiops.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["tenant", "create", "--slug", {{ .Values.tenant.slug | quote }}, "--name", {{ default .Values.tenant.slug .Values.tenant.name | quote }}]
        {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env: *install-env
          volumeMounts: *install-mounts
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        {{- include "aiops.tmpVolume" . | nindent 8 }}
