name: Release

# Builds the images for a version tag, pushes them to the registry by digest, signs each
# digest and attaches its bill of materials as a signed attestation.
#
# Signing is keyless (Sigstore): the signature says "built by this workflow, in this
# repository, at this commit", and is recorded in a public transparency log. A customer
# verifies an image before deploying it with:
#
#   cosign verify <image>@<digest> \
#     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# This workflow has not run yet: no version has been tagged.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  COSIGN_VERSION: v2.6.5

jobs:
  images:
    name: Build, sign and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # the short-lived identity the signature is made with
    strategy:
      matrix:
        include:
          - {target: production, suffix: ""}
          - {target: runner, suffix: "-runner"}
          - {target: ui, suffix: "-ui"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image name
        id: name
        run: |
          repo=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${repo}/l1-and-l2-ai-ops${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.name.outputs.version }}
          provenance: mode=max
          sbom: false

      - name: Bill of materials of what was pushed
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # By digest, never by tag: a tag can be moved after it was signed.
      - name: Sign the image and attest its bill of materials
        env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Signed and verified: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom${{ matrix.suffix }}
          path: sbom.cdx.json
